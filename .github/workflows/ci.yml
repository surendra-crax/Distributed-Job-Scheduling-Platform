name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-and-typecheck:
    name: Linting & Type Checking
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff Lint Check
        run: ruff check .

      - name: Run Ruff Formatting Check
        run: ruff format --check .

      - name: Run mypy Static Type Checking
        run: mypy app

  test-and-coverage:
    name: Test Suite & Coverage
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: job_scheduler_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Alembic Migrations
        env:
          DATABASE_SYNC_URL: postgresql+psycopg://postgres:postgres@localhost:5432/job_scheduler_test
        run: alembic upgrade head

      - name: Run Automated Test Suite with Coverage
        env:
          ENVIRONMENT: testing
          POSTGRES_DB: job_scheduler_test
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/job_scheduler_test
          DATABASE_SYNC_URL: postgresql+psycopg://postgres:postgres@localhost:5432/job_scheduler_test
          REDIS_URL: redis://localhost:6379/1
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml tests/

      - name: Run Concurrency Benchmark Verification
        env:
          ENVIRONMENT: testing
          POSTGRES_DB: job_scheduler_test
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/job_scheduler_test
          DATABASE_SYNC_URL: postgresql+psycopg://postgres:postgres@localhost:5432/job_scheduler_test
          REDIS_URL: redis://localhost:6379/1
        run: python tests/benchmark_concurrency.py
