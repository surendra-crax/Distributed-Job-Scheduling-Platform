# Render Blueprint Specification for Distributed Job Scheduling Platform
# Documentation: https://render.com/docs/blueprint-spec

services:
  # =========================================================================
  # 1. Web Service (FastAPI REST API + Mission Control Dashboard)
  # Runs Alembic migrations on startup and supervises background services
  # =========================================================================
  - type: web
    name: job-scheduler-platform
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    branch: main
    healthCheckPath: /health/ready
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: job-scheduler-db
          property: connectionString
      - key: REDIS_URL
        sync: false # Set in Render Dashboard or Upstash free Redis
      - key: WORKER_CONCURRENCY
        value: "4"
      - key: SCHEDULER_POLL_INTERVAL_SECONDS
        value: "1.0"
      - key: RECOVERY_POLL_INTERVAL_SECONDS
        value: "10.0"

# =========================================================================
# Managed PostgreSQL Database
# =========================================================================
databases:
  - name: job-scheduler-db
    databaseName: job_scheduler
    user: scheduler_admin
    plan: free
    region: oregon
